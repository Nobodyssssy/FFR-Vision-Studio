name: Windows build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      build:
        description: Optional build number (0 = automatic)
        default: '0'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build
        shell: pwsh
        run: |
          $inputBuild = '${{ github.event.inputs.build }}'
          $build = [Math]::Max(16, [int]$env:GITHUB_RUN_NUMBER)
          if ($inputBuild -match '^[1-9][0-9]*$') {
            $build = [int]$inputBuild
          }
          Write-Host "Building FFR Vision Studio version 1.0.0.$build"
          flutter build windows --release --build-name 1.0.0 --build-number $build --dart-define=APP_VERSION=1.0.0 --dart-define=APP_BUILD=$build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Rename-Item build/windows/x64/runner/Release/ffr_vision_studio.exe 'FFR Vision Studio.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: FFR-Vision-Studio-windows
          path: build/windows/x64/runner/Release/
